</style></head><body><header class="deck-header"><div class="brand-text"><span class="brand-course">AI Thực Chiến · K5 Level 3</span><strong>Day 09 · Evaluation</strong></div><nav class="cp-rail" aria-label="Checkpoint"></nav><div><button id="noteButton">Ghi chú N</button> <button id="full">Toàn màn hình F</button></div></header><main id="deck"></main><aside id="notes"></aside><div class="meter"></div><footer class="deck-footer"><span id="count"></span><span>← → chuyển slide · N ghi chú · F toàn màn hình</span><div><button id="prev">Trước</button> <button id="next">Tiếp</button></div></footer><script>const slides=[{"cp": "INTRO", "title": "Lab 9 · Đánh giá agent và phân tích lỗi", "body": "<p class=\"lede\">LogiX-VN refund agent · Lớp 16:00–19:30</p><h2>Agent làm tốt đến đâu?</h2><p>Tìm lỗi cụ thể và ngăn phiên bản có lỗi được đưa vào sử dụng.</p>", "note": "", "code": ""}, {"cp": "INTRO", "title": "Lab 8 và Lab 9", "body": "<div class=\"grid grid-2\"><div class=\"panel\"><h3>Lab 8 · Xây dựng agent</h3><p>Xây dựng agent và kiểm tra agent có chạy được hay không.</p></div><div class=\"panel\"><h3>Lab 9 · Đánh giá chất lượng</h3><p>Đánh giá agent làm tốt đến đâu, tìm các lỗi cụ thể và chặn phiên bản có lỗi trước khi merge.</p></div></div>", "note": "", "code": ""}, {"cp": "INTRO", "title": "Hai phần của bài lab", "body": "<div class=\"grid grid-2\"><div class=\"panel\"><h3>Phần 1 · Cơ bản · M0–M4</h3><p>Chuẩn bị dữ liệu, phân loại lỗi, kiểm tra mô hình chấm, viết bộ chấm và tạo cổng kiểm tra.</p><p><strong>60 điểm · Hoàn thành trên lớp · 16:00–19:30</strong></p></div><div class=\"panel\"><h3>Phần 2 · Nâng cao · M5–M7</h3><p>Kiểm tra theo nhóm yêu cầu, đánh giá độ ổn định và phát hiện báo cáo bị làm sai.</p><p><strong>40 điểm · Advanced 25 + Expert 15</strong></p></div></div>", "note": "", "code": ""}, {"cp": "INTRO", "title": "Phần cơ bản · M0–M4", "body": "<ol><li>Chuẩn bị môi trường và tạo bộ yêu cầu mẫu.</li><li>Phân loại những lỗi agent có thể mắc phải.</li><li>Kiểm tra độ tin cậy của mô hình dùng để chấm.</li><li>Viết các quy tắc chấm kết quả.</li><li>Xây dựng cổng kiểm tra tự động.</li></ol>", "note": "", "code": ""}, {"cp": "INTRO", "title": "Phần nâng cao · M5–M7", "body": "<ul><li><strong>M5:</strong> Bổ sung yêu cầu thử thách và kiểm tra riêng từng nhóm yêu cầu.</li><li><strong>M6:</strong> Chạy nhiều seed để đo dao động và đánh giá độ ổn định.</li><li><strong>M7:</strong> Phát hiện báo cáo thiếu lượt chạy, bỏ kết quả thất bại hoặc bị làm đẹp.</li></ul><p class=\"note\">Điểm trung bình chung có thể che khuất lỗi trong một nhóm yêu cầu quan trọng.</p>", "note": "", "code": ""}, {"cp": "INTRO", "title": "Quy định khi làm bài", "body": "<ul><li>Ghép Lab 9 vào repo Lab 8 của nhóm.</li><li>Giữ nguyên mã nguồn Lab 8.</li><li>Sinh báo cáo bằng script, không chỉnh sửa bằng tay.</li><li>Lưu nhãn đáp án riêng với bộ yêu cầu.</li><li>Sử dụng MockLLM, không cần khóa API.</li></ul><p class=\"note\"><strong>Hạn nộp: 23 giờ 59 phút cùng ngày.</strong></p>", "note": "", "code": ""}, {"cp": "INTRO", "title": "Các bước cơ bản · M0–M2", "body": "<div class=\"stack\"><div class=\"panel\"><h3>M0 · Chuẩn bị</h3><p>Đưa Lab 9 vào repo Lab 8 của nhóm và tạo bộ yêu cầu mẫu.</p></div><div class=\"panel\"><h3>M1 · Gọi tên lỗi</h3><p>Đọc dấu vết hoạt động, lập bảng kiểu lỗi và gắn mã lỗi phù hợp cho từng yêu cầu.</p></div><div class=\"panel\"><h3>M2 · Kiểm tra mô hình chấm</h3><p>So kết quả mô hình chấm với nhãn con người để kiểm tra độ tin cậy.</p></div></div>", "note": "", "code": ""}, {"cp": "INTRO", "title": "Các bước cơ bản · M3–M4", "body": "<div class=\"grid grid-2\"><div class=\"panel\"><h3>M3 · Viết bộ chấm</h3><p>Kiểm tra agent có hoàn sai tiền hoặc giao dịch khi chưa được duyệt không.</p></div><div class=\"panel\"><h3>M4 · Tạo cổng kiểm tra</h3><p>So bản mới với bản chuẩn trên cùng bộ yêu cầu.</p><p>Cho qua bản sửa đúng và chặn bản có hồi quy rõ ràng.</p></div></div>", "note": "", "code": ""}, {"cp": "INTRO", "title": "Các bước nâng cao · M5–M7", "body": "<table class=\"data\"><tr><th>Checkpoint</th><th>Việc thực hiện</th></tr><tr><td>M5 · Theo nhóm</td><td>Thêm yêu cầu gài bẫy và kiểm tra từng slice, ví dụ nhóm có hoàn tiền.</td></tr><tr><td>M6 · Độ ổn định</td><td>Chạy nhiều seed, đo dao động tự nhiên và kiểm tra mức thành công ổn định.</td></tr><tr><td>M7 · Toàn vẹn kết quả</td><td>Phát hiện thiếu lượt chạy, bỏ lượt thất bại, chọn seed thuận lợi hoặc nới ngưỡng chấm.</td></tr></table>", "note": "", "code": ""}, {"cp": "INTRO", "title": "Quy trình đánh giá", "body": "<p class=\"lede\">Mỗi lần chạy tạo bằng chứng cho quyết định merge.</p><ol><li>Chọn yêu cầu từ eval set và chạy agent.</li><li>Bộ chấm kiểm tra kết quả cùng dấu vết hoạt động.</li><li>Báo cáo tổng hợp kết quả qua các lượt chạy.</li><li>Cổng so sánh với baseline để cho qua hoặc chặn.</li></ol>", "note": "", "code": ""}, {"cp": "M0", "title": "Checkpoint M0: Môi trường và eval set", "body": "<p class=\"lede\">16:00–16:15 · 15 phút</p><div class=\"grid grid-2\"><div class=\"panel\"><h3>Nhóm thực hiện</h3><p>Cài overlay vào repo Lab 8, cài dependencies, chạy smoke và build eval set.</p></div><div class=\"panel\"><h3>Sản phẩm cần có</h3><p>Eval set v1 và labels riêng; môi trường sẵn sàng.</p></div></div><p class=\"note\"><strong>Điều kiện hoàn thành:</strong> smoke in M0 PASS; evalset --build trả exit 0. failure_modes còn rỗng ở bước này.</p>", "note": "Giảng viên giới thiệu đầu ra trước khi hướng dẫn chi tiết. Nhấn P để bắt đầu đồng hồ khi nhóm bắt tay thực hành. Kiểm tra bằng chứng hoàn thành trước khi chuyển checkpoint.", "code": ""}, {"cp": "M0", "title": "Môi trường Lab 9", "body": "<ul><li>Starter cần package và dữ liệu Lab 8.</li><li>Core chạy trên swarm reference do giảng viên cung cấp.</li><li>Lab 8 còn TODO vẫn có thể làm Lab 9.</li><li>MockLLM và judge replay chạy offline, không cần API key.</li><li>Giữ nguyên src/lab8/ và sinh reports bằng script.</li></ul>", "note": "Phân biệt yêu cầu giữ nguyên package Lab 8 với yêu cầu hoàn thành bài Lab 8. Không dạy observability trong bài này.", "code": ""}, {"cp": "M0", "title": "Cài overlay và kiểm tra", "body": "<p>Chép nội dung src/, docs/, .github/ từ starter vào repo Lab 8. Giữ các file gốc của Lab 8.</p><p class=\"note\">Thực hiện trên nhánh starter/d09. Đọc hướng dẫn cài đặt đầy đủ trong README.</p>", "note": "", "code": "cd src\npython -m pip install -r requirements.txt -r requirements-lab9.txt\npython -m lab9.smoke\npython -m lab9.evalset --build"}, {"cp": "M1", "title": "Checkpoint M1: Taxonomy và trace case", "body": "<p class=\"lede\">16:15–17:00 · 45 phút</p><div class=\"grid grid-2\"><div class=\"panel\"><h3>Nhóm thực hiện</h3><p>Đọc trace, xác định bước sai đầu tiên, điền taxonomy và gắn failure_modes cho item.</p></div><div class=\"panel\"><h3>Sản phẩm cần có</h3><p>Ít nhất 5 FM có bằng chứng, trace case có regression test và eval set đã gắn mã.</p></div></div><p class=\"note\"><strong>Điều kiện hoàn thành:</strong> evalset --check không có lỗi; 5 anchor khớp mã FM và bước sai đầu tiên theo key giảng viên.</p>", "note": "Giảng viên giới thiệu đầu ra trước khi hướng dẫn chi tiết. Nhấn P để bắt đầu đồng hồ khi nhóm bắt tay thực hành. Kiểm tra bằng chứng hoàn thành trước khi chuyển checkpoint.", "code": ""}, {"cp": "M1", "title": "Failure taxonomy", "body": "<p class=\"lede\">Mỗi loại lỗi phải quan sát được trên trace.</p><ul><li>Định nghĩa rõ hành vi sai.</li><li>Ghi layer gây lỗi và claim@seed làm bằng chứng.</li><li>Chọn code, judge hoặc human để chấm.</li><li>Liên kết failure mode với metric.</li></ul>", "note": "M1 yêu cầu ít nhất 5 failure mode có bằng chứng. Mã và tên ngắn trong mẫu taxonomy được cố định.", "code": ""}, {"cp": "M1", "title": "Các lỗi cần nhận diện", "body": "<table class=\"data\"><tr><th>FM</th><th>Hành vi sai</th></tr><tr><td>01 / 02</td><td>Lộ secret / bỏ qua approval bị từ chối</td></tr><tr><td>03 / 04</td><td>Tin ticket hơn DB / tính hoặc làm tròn sai tiền</td></tr><tr><td>05 / 06</td><td>Trừ tiền hai lần / dùng điều khoản cũ</td></tr><tr><td>07 / 08</td><td>Hoàn nhầm claim / reply khác ledger</td></tr><tr><td>09 (v2)</td><td>Lẫn dữ liệu giữa principal</td></tr></table>", "note": "FM-05 tên pre_deducted: agent tự trừ lịch sử hoàn tiền trước khi host trừ tiếp. Định nghĩa cần dựa vào trace cụ thể.", "code": ""}, {"cp": "M1", "title": "Bước sai đầu tiên", "body": "<ol><li>Chọn một trial fail trong report.</li><li>Đọc ledger và đối chiếu nhãn.</li><li>Tìm event đầu tiên dẫn tới quyết định sai.</li><li>So cùng claim@seed trên fixed.</li><li>Thêm regression test hoặc item có provenance.from_trace.</li></ol>", "note": "", "code": "python -m lab9.trace_case --shape seeded_regression --claim C-002 --seed 11\npython -m lab9.trace_case --shape fixed --claim C-002 --seed 11"}, {"cp": "M1", "title": "Eval set có nguồn gốc", "body": "<div class=\"grid grid-2\"><div class=\"panel\"><h3>Item</h3><p>item_id, claim_id, failure_modes, provenance, split, eval_set_version</p></div><div class=\"panel\"><h3>Nhãn riêng</h3><p>labels_v1.json chứa kết quả mong đợi của từng claim.</p></div></div><p class=\"note\">V1 có 14 item × 5 seed = 70 trial. Không coi 70 trial là 70 tình huống độc lập.</p>", "note": "", "code": "python -m lab9.evalset --check"}, {"cp": "M2", "title": "Checkpoint M2: Judge calibration", "body": "<p class=\"lede\">17:00–17:45 · 45 phút</p><div class=\"grid grid-2\"><div class=\"panel\"><h3>Nhóm thực hiện</h3><p>Hoàn thiện thống kê calibration, chạy hai CSV judge và audit bất đồng.</p></div><div class=\"panel\"><h3>Sản phẩm cần có</h3><p>Bảng κ, precision, recall; audit ít nhất 5 case và hành động sửa rubric.</p></div></div><p class=\"note\"><strong>Điều kiện hoàn thành:</strong> Tone đạt ngưỡng; helpful bị loại với giải thích có bằng chứng. Các hàm stats đạt test.</p>", "note": "Giảng viên giới thiệu đầu ra trước khi hướng dẫn chi tiết. Nhấn P để bắt đầu đồng hồ khi nhóm bắt tay thực hành. Kiểm tra bằng chứng hoàn thành trước khi chuyển checkpoint.", "code": ""}, {"cp": "M2", "title": "Judge-the-judge", "body": "<p class=\"lede\">Judge cũng có thể bỏ sót lỗi hoặc báo lỗi nhầm.</p><ul><li>So nhãn judge với nhãn người.</li><li>Quy ước FAIL là lớp dương.</li><li>Precision: trong các lỗi được báo, bao nhiêu là lỗi thật?</li><li>Recall: trong các lỗi thật, phát hiện được bao nhiêu?</li><li>Kappa đo đồng thuận sau khi tính phần trùng hợp ngẫu nhiên.</li></ul>", "note": "", "code": ""}, {"cp": "M2", "title": "Điều kiện dùng judge", "body": "<table class=\"data\"><tr><th>Chỉ số</th><th>Ngưỡng lab</th></tr><tr><td>Cohen’s κ</td><td>≥ 0,6</td></tr><tr><td>Precision</td><td>≥ 0,8</td></tr><tr><td>Recall</td><td>≥ 0,7</td></tr></table><p class=\"note\">Kappa không xác định thì calibration FAIL. Tiền và approval luôn chấm bằng code.</p>", "note": "Không kết luận một judge tốt cho mọi nhiệm vụ chỉ vì đạt ngưỡng trên CSV này.", "code": ""}, {"cp": "M2", "title": "Thực hành calibration và audit", "body": "<p>Hoàn thiện confusion, precision_recall, cohen_kappa và rogan_gladen trong stats.py.</p><p>Audit ít nhất 5 bất đồng và đề xuất chỉnh rubric.</p><p class=\"note\">Tham chiếu của lab: tone dùng được (κ≈0,757, P≈0,857, R=0,8). Helpful không đạt.</p>", "note": "", "code": "python -m lab9.judge --csv data/eval/judge_tone_public.csv --audit 5\npython -m lab9.judge --csv data/eval/judge_helpful_public.csv --audit 5"}, {"cp": "M2", "title": "Hiệu chỉnh tỉ lệ lỗi quan sát", "body": "<p class=\"lede\">Rogan–Gladen điều chỉnh tỉ lệ lỗi khi judge chấm sai.</p><pre class=\"code\">p_corrected = (p_observed + specificity - 1)\n              / (sensitivity + specificity - 1)</pre><p>Ví dụ minh họa: p_observed=0,20, sensitivity=0,80, specificity=0,90 thì p_corrected≈0,143.</p><p class=\"note\">Hàm trong lab giới hạn kết quả trong [0,1]. Mẫu calibration nhỏ vẫn gây bất định.</p>", "note": "", "code": ""}, {"cp": "M3", "title": "Checkpoint M3: Trajectory graders", "body": "<p class=\"lede\">17:45–18:30 · 45 phút</p><div class=\"grid grid-2\"><div class=\"panel\"><h3>Nhóm thực hiện</h3><p>Hoàn thiện ApprovalBypass, RefundAmountCorrect và thêm grader cùng metric FM-08.</p></div><div class=\"panel\"><h3>Sản phẩm cần có</h3><p>Grader đăng ký trong GRADERS và metric FM-08 blocking trong spec.</p></div></div><p class=\"note\"><strong>Điều kiện hoàn thành:</strong> Tests đạt; phát hiện ít nhất 80% trace lỗi, báo nhầm không quá 10% trên fixed.</p>", "note": "Giảng viên giới thiệu đầu ra trước khi hướng dẫn chi tiết. Nhấn P để bắt đầu đồng hồ khi nhóm bắt tay thực hành. Kiểm tra bằng chứng hoàn thành trước khi chuyển checkpoint.", "code": ""}, {"cp": "M3", "title": "Chấm kết quả và quá trình", "body": "<table class=\"data\"><tr><th>Cấp độ</th><th>Ví dụ</th></tr><tr><td>Outcome</td><td>Số tiền trong ledger có đúng không?</td></tr><tr><td>Step</td><td>Có event ghi đè fact DB bằng lời trong ticket không?</td></tr><tr><td>Trajectory</td><td>Có chuyển tiền trái approval hoặc lộ secret trong quá trình chạy không?</td></tr></table><p class=\"note\">Grader đọc Trial và nhãn. Grader không gọi model hoặc chạy lại agent.</p>", "note": "", "code": ""}, {"cp": "M3", "title": "Hai grader cần hoàn thiện", "body": "<div class=\"grid grid-2\"><div class=\"panel\"><h3>ApprovalBypass</h3><p>Trả True nếu có refund khi approval không hợp lệ, hoặc xuất hiện ledger row ngoài quyền.</p><p>True nghĩa là vi phạm.</p></div><div class=\"panel\"><h3>RefundAmountCorrect</h3><p>So snapshot.refund_vnd với label.refund_vnd.</p><p>True nghĩa là đúng.</p></div></div>", "note": "Nhấn mạnh chiều của metric: safety đếm vi phạm nên cần bằng 0. Capability đếm thành công nên cần đạt sàn.", "code": ""}, {"cp": "M3", "title": "Metric riêng cho FM-08", "body": "<p>Agent có thể hoàn đúng nhưng báo sai số tiền cho khách.</p><ol><li>Đọc reply trong events và số tiền thực tế trong ledger.</li><li>Viết grader phát hiện sự không nhất quán.</li><li>Đăng ký vào GRADERS.</li><li>Thêm blocking capability metric vào metric_spec.yaml.</li></ol><p class=\"note\">Chấp nhận cách diễn đạt khác nếu ý nghĩa và số tiền đúng.</p>", "note": "Không dùng khớp cứng toàn bộ câu reply. Học viên tự thiết kế metric FM-08 và giải thích giới hạn.", "code": ""}, {"cp": "M3", "title": "Kiểm tra chất lượng grader", "body": "<p>Trên các trace lỗi, grader cần phát hiện ít nhất 80%. Trên fixed, tỉ lệ báo nhầm không quá 10%.</p>", "note": "", "code": "python -m pytest -q -m student -o addopts= -k \"lab9 and not advanced\"\npython -m lab9.mutation --detect"}, {"cp": "M4", "title": "Checkpoint M4: Bootstrap và CI gate", "body": "<p class=\"lede\">18:30–19:15 · 45 phút</p><div class=\"grid grid-2\"><div class=\"panel\"><h3>Nhóm thực hiện</h3><p>Hoàn thiện paired bootstrap, sinh và commit baseline, chạy gate rồi hoàn thiện hồ sơ nộp.</p></div><div class=\"panel\"><h3>Sản phẩm cần có</h3><p>Reports sinh bằng script, CI xanh, eval card, PRD v1.1 và harness_map.</p></div></div><p class=\"note\"><strong>Điều kiện hoàn thành:</strong> fixed exit 0; seeded_regression exit 1 vì pass_rate. CI bootstrap lệch không quá 0,01 so với tham chiếu.</p>", "note": "Giảng viên giới thiệu đầu ra trước khi hướng dẫn chi tiết. Nhấn P để bắt đầu đồng hồ khi nhóm bắt tay thực hành. Kiểm tra bằng chứng hoàn thành trước khi chuyển checkpoint.", "code": ""}, {"cp": "M4", "title": "Baseline và báo cáo PR", "body": "<p>Baseline lấy từ swarm trên nhánh chuẩn, sau khi hoàn thành M1–M3. Commit baseline để CI đọc được.</p><p class=\"note\">Cùng eval set, cùng seed và cùng metric spec để so sánh có ý nghĩa.</p>", "note": "", "code": "python -m lab9.eval --shape swarm --spec config/metric_spec.yaml --out reports/baseline_v1.json\ngit add -f reports/baseline_v1.json\ngit commit -m \"chore: add eval baseline v1\""}, {"cp": "M4", "title": "Paired bootstrap", "body": "<ol><li>Tính điểm trung bình qua seed cho từng item.</li><li>Ghép điểm PR và baseline của cùng item.</li><li>Lấy mẫu lại các cặp item để ước lượng khoảng tin cậy của Δ.</li><li>Δ = điểm PR − điểm baseline.</li></ol><p class=\"note\">Hoàn thiện stats.paired_bootstrap bằng scipy.stats.bootstrap(paired=True), percentile, CI 95%.</p>", "note": "Đơn vị resample là item. Các seed cùng item không được xem như những tình huống độc lập.", "code": ""}, {"cp": "M4", "title": "Cách đọc khoảng tin cậy", "body": "<table class=\"data\"><tr><th>CI của Δ</th><th>Diễn giải</th></tr><tr><td>[−0,50, −0,057]</td><td>Giảm có ý nghĩa theo quy tắc lab, block</td></tr><tr><td>[−0,05, +0,03]</td><td>Chưa đủ bằng chứng giảm, vẫn cần kiểm tra sàn</td></tr><tr><td>[+0,01, +0,08]</td><td>Cải thiện theo phép so sánh này</td></tr></table><p class=\"note\">Tham chiếu seeded_regression: pass_rate Δ≈−0,271. CI chứa 0 không chứng minh hai bản tương đương.</p>", "note": "", "code": ""}, {"cp": "M4", "title": "Quy tắc gate", "body": "<ul><li>Safety: approval_bypass và secret_leak phải bằng 0.</li><li>Capability: đạt sàn và không giảm có ý nghĩa khi spec yêu cầu.</li><li>Metric theo dõi có thể cảnh báo mà không chặn.</li><li>exit 0 cho phép merge, exit 1 chặn merge.</li></ul><p class=\"note\">Đổi eval set cần phiên bản và baseline mới. Cùng phiên bản chỉ được siết ngưỡng.</p>", "note": "", "code": ""}, {"cp": "M4", "title": "Demo gate trên hai biến thể", "body": "<p>fixed phải được cho qua. seeded_regression phải bị chặn vì pass_rate.</p>", "note": "", "code": "python -m lab9.eval --shape fixed\npython -m lab9.gate --pr reports/eval_fixed.json --baseline reports/baseline_v1.json\npython -m lab9.eval --shape seeded_regression\npython -m lab9.gate --pr reports/eval_seeded_regression.json --baseline reports/baseline_v1.json"}, {"cp": "M4", "title": "Nộp Core", "body": "<ul><li>Taxonomy, trace case có regression test, judge audit.</li><li>Eval set v1 và labels tách riêng, graders và stats hoàn thiện.</li><li>Baseline, report fixed và seeded_regression do script sinh.</li><li>Eval card, PRD v1.1 và section eval trong harness_map.</li><li>PR starter/d09 vào main, CI xanh và bằng chứng gate chặn regression.</li></ul><p class=\"note\">Core 60 điểm. Chấm commit cuối trước 23:59 cùng ngày.</p>", "note": "", "code": ""}, {"cp": "M5", "title": "Checkpoint M5: Adversarial và slice gate", "body": "<p class=\"lede\">Sau 19:30 · Advanced</p><div class=\"grid grid-2\"><div class=\"panel\"><h3>Nhóm thực hiện</h3><p>Điền fm_map, build v2, thêm slice money_movement và adversarial rồi hoàn thiện slice_check.</p></div><div class=\"panel\"><h3>Sản phẩm cần có</h3><p>Eval set và labels v2, spec v2, baseline v2.</p></div></div><p class=\"note\"><strong>Điều kiện hoàn thành:</strong> V2 check sạch, mỗi FM bị tấn công có ít nhất 3 item; slice gate chặn slice_regression.</p>", "note": "Giảng viên giới thiệu đầu ra trước khi hướng dẫn chi tiết. Nhấn P để bắt đầu đồng hồ khi nhóm bắt tay thực hành. Kiểm tra bằng chứng hoàn thành trước khi chuyển checkpoint.", "code": ""}, {"cp": "M5", "title": "Regression trong một nhóm nhỏ", "body": "<p class=\"lede\">Điểm trung bình có thể che khuất nhóm hoàn tiền bị lỗi.</p><div class=\"grid grid-2\"><div class=\"panel\"><h3>Toàn bộ eval set</h3><p>Pass rate vẫn đạt sàn.</p></div><div class=\"panel panel--warn\"><h3>Slice money_movement</h3><p>Các yêu cầu cần hoàn tiền bị giảm chất lượng.</p></div></div><p class=\"note\">Gate v2 cần slice money_movement và adversarial có blocking.</p>", "note": "", "code": ""}, {"cp": "M5", "title": "Eval set v2 và slice gate", "body": "<ol><li>Map cơ chế tấn công sang FM trong config/fm_map.yaml.</li><li>Build v2 từ v1 và adversarial pack.</li><li>Bảo đảm mỗi FM bị tấn công có ít nhất 3 item.</li><li>Hoàn thiện gate.slice_check và spec v2.</li><li>Sinh baseline_v2.json.</li></ol>", "note": "", "code": "python -m lab9.evalset --v2 --build\npython -m lab9.eval --shape swarm --spec config/metric_spec_v2.yaml --out reports/baseline_v2.json"}, {"cp": "M6", "title": "Checkpoint M6: Nhiễu và độ ổn định", "body": "<p class=\"lede\">Sau 19:30 · Advanced</p><div class=\"grid grid-2\"><div class=\"panel\"><h3>Nhóm thực hiện</h3><p>Cài pass_at_k, pass_hat_k; chạy A/A hai bộ seed và chọn sàn pass_hat_5.</p></div><div class=\"panel\"><h3>Sản phẩm cần có</h3><p>Metric pass_hat_5 blocking, bằng chứng A/A và giải thích cách chọn ngưỡng.</p></div></div><p class=\"note\"><strong>Điều kiện hoàn thành:</strong> Hàm đúng cả đầu vào biên; A/A tham chiếu Δ=0; sàn pass_hat_5 ít nhất 0,8 và chặn flaky_regression.</p>", "note": "Giảng viên giới thiệu đầu ra trước khi hướng dẫn chi tiết. Nhấn P để bắt đầu đồng hồ khi nhóm bắt tay thực hành. Kiểm tra bằng chứng hoàn thành trước khi chuyển checkpoint.", "code": ""}, {"cp": "M6", "title": "Thành công một lần và ổn định nhiều lần", "body": "<table class=\"data\"><tr><th>Metric</th><th>Câu hỏi</th></tr><tr><td>pass@k</td><td>Ít nhất một trong k lần thành công?</td></tr><tr><td>pass^k</td><td>Tất cả k lần đều thành công?</td></tr></table><p>Ví dụ có 4/5 lần đúng: pass@1 = 0,8, pass@5 = 1, pass^5 = 0.</p><p class=\"note\">Hoàn thiện pass_at_k và pass_hat_k. Spec v2 cần pass_hat_5 blocking, sàn ít nhất 0,8.</p>", "note": "", "code": ""}, {"cp": "M6", "title": "A/A và giới hạn cỡ mẫu", "body": "<p>Chạy cùng agent với hai bộ seed để quan sát dao động tự nhiên. Dùng kết quả đó khi chọn ngưỡng.</p><p class=\"note\">MockLLM trong bài cho Δ=0 ở A/A tham chiếu. Model thật có thể dao động. Năm seed không bảo đảm phát hiện ổn định mọi lỗi hiếm.</p>", "note": "", "code": "python -m lab9.mutation --spec config/metric_spec_v2.yaml --aa 66,77,88,99,110"}, {"cp": "M7", "title": "Checkpoint M7: Integrity và ratchet", "body": "<p class=\"lede\">Sau 19:30 · Expert · Hạn 23:59</p><div class=\"grid grid-2\"><div class=\"panel\"><h3>Nhóm thực hiện</h3><p>Hoàn thiện integrity_check, đối chiếu base spec, chạy traps và mutation scorecard.</p></div><div class=\"panel\"><h3>Sản phẩm cần có</h3><p>Bằng chứng chặn report sai và spec bị nới; eval card v2 ghi giới hạn.</p></div></div><p class=\"note\"><strong>Điều kiện hoàn thành:</strong> Mọi trap công khai bị chặn; scorecard 3/3 regression và 0 báo nhầm. Bộ chấm còn dùng trap ẩn.</p>", "note": "Giảng viên giới thiệu đầu ra trước khi hướng dẫn chi tiết. Nhấn P để bắt đầu đồng hồ khi nhóm bắt tay thực hành. Kiểm tra bằng chứng hoàn thành trước khi chuyển checkpoint.", "code": ""}, {"cp": "M7", "title": "Tính toàn vẹn của report", "body": "<ul><li>Chặn NaN, inf, evaluator_failures và điểm grader bị thiếu.</li><li>Kiểm tra đủ item × seed, phát hiện dòng thiếu hoặc trùng.</li><li>Không cho chọn lại seed hoặc đổi nhãn slice để che lỗi.</li><li>Đối chiếu spec gốc để chặn nới sàn, bỏ metric hoặc bỏ slice.</li></ul><p class=\"note\">Hoàn thiện gate.integrity_check. Report không đáng tin phải bị chặn trước khi so điểm.</p>", "note": "", "code": ""}, {"cp": "M7", "title": "Scorecard và traps", "body": "<p>Gate cần chặn 3 regression công khai và không báo nhầm fixed, honest_refactor. Bộ chấm còn dùng biến thể ẩn.</p>", "note": "Sinh eval_slice_regression.json bằng lab9.eval trước khi chạy traps. Traps exit 0 khi mọi trap đều bị chặn. Không hardcode tên variant.", "code": "python -m lab9.mutation --spec config/metric_spec_v2.yaml --baseline reports/baseline_v2.json\npython -m lab9.traps --pr reports/eval_slice_regression.json --baseline reports/baseline_v2.json --spec config/metric_spec_v2.yaml"}, {"cp": "M7", "title": "Eval card và quyết định release", "body": "<ul><li>Ghi code version, eval set SHA, metric spec và run ID.</li><li>Trình bày baseline so với PR cùng CI.</li><li>Nêu judge nào được dùng và lý do.</li><li>Ghi gate owner và quy trình xử lý khi block.</li><li>Nêu rõ giới hạn MockLLM, dữ liệu nhỏ, judge replay.</li></ul><p class=\"note\">PRD v1.1 biến “agent chạy đúng” thành tiêu chí đo được và phân công trách nhiệm.</p>", "note": "", "code": ""}, {"cp": "M7", "title": "Checklist cuối buổi", "body": "<table class=\"data\"><tr><th>Mức</th><th>Bằng chứng cần có</th><th>Điểm</th></tr><tr><td>Core</td><td>Taxonomy, calibration, graders, bootstrap gate, eval card</td><td>60</td></tr><tr><td>Advanced</td><td>V2, slice, pass@k / pass^k và không báo nhầm</td><td>25</td></tr><tr><td>Expert</td><td>Integrity, ratchet và chặn lỗi chập chờn</td><td>15</td></tr></table><p>Thảo luận: gate còn có thể bỏ sót lỗi nào? Cần thêm dữ liệu gì trước khi pilot?</p>", "note": "Nguồn nội dung: README.md, CHECKPOINTS.md, RUBRIC.md, SUBMISSION.md, docs/ và src/lab9/. Thiết kế tham chiếu: https://minhhai203.github.io/k5-day08-instructor-slides/", "code": ""}];
const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');let current=Math.max(0,Math.min(slides.length-1,Number(location.hash.slice(1)||1)-1));
document.querySelector('#deck').innerHTML=slides.map((s,i)=>`<section class="slide" aria-label="${s.title}"><div class="slide-inner"><div class="section-tag">${s.cp==='INTRO'?'PHẦN 1 · TỔNG QUAN':'PHẦN 2 · CHECKPOINT '+s.cp} / LAB 09</div><h1>${s.title}</h1>${s.body}${s.code?`<pre class="code">${esc(s.code)}</pre>`:''}</div></section>`).join('');
document.querySelector('.cp-rail').innerHTML=[...new Set(slides.map(s=>s.cp))].map(cp=>`<button data-cp="${cp}">${cp}</button>`).join('');
function show(n){current=Math.max(0,Math.min(slides.length-1,n));document.querySelectorAll('.slide').forEach((el,i)=>{el.style.display=i===current?'flex':'none';el.setAttribute('aria-hidden',i!==current)});document.querySelector('#count').textContent=`${current+1} / ${slides.length}`;document.querySelector('#notes').innerHTML=`<h2>Ghi chú giảng viên</h2><h3>${slides[current].title}</h3><p>${slides[current].note||(slides[current].cp==='INTRO'?'':'Đối chiếu với checkpoint tương ứng trong repo. Cho học viên giải thích bằng ví dụ của nhóm.')}</p>`;document.querySelectorAll('[data-cp]').forEach(b=>b.classList.toggle('active-cp',b.dataset.cp===slides[current].cp));document.querySelector('.meter').style.width=`${100*(current+1)/slides.length}%`;document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===slides.length-1;history.replaceState(null,'','#'+(current+1))}
document.querySelector('#next').onclick=()=>show(current+1);document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#noteButton').onclick=()=>document.querySelector('#notes').classList.toggle('open');document.querySelector('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>show(slides.findIndex(s=>s.cp===b.dataset.cp)));document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key))show(current-1);if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);if(e.key.toLowerCase()==='n')document.querySelector('#noteButton').click();if(e.key.toLowerCase()==='f')document.querySelector('#full').click()});show(current);</script><script>const plan={INTRO:{minutes:0,time:'Giới thiệu trước thực hành',label:'Tổng quan'},M0:{minutes:15,time:'16:00–16:15',label:'Môi trường'},M1:{minutes:45,time:'16:15–17:00',label:'Taxonomy'},M2:{minutes:45,time:'17:00–17:45',label:'Calibration'},M3:{minutes:45,time:'17:45–18:30',label:'Graders'},M4:{minutes:45,time:'18:30–19:15',label:'Gate'},M5:{minutes:0,time:'Sau 19:30',label:'Slice · tự học'},M6:{minutes:0,time:'Sau 19:30',label:'Độ ổn định · tự học'},M7:{minutes:0,time:'Hạn 23:59',label:'Integrity · tự học'}};

const timer=document.createElement('div');timer.className='lab-timer';timer.innerHTML='<div id="slot"></div><div><strong id="remaining">15:00</strong> <button id="startTimer">Bắt đầu</button> <button id="resetTimer" aria-label="Đặt lại đồng hồ">↺</button></div><small id="timerStatus">Nhấn bắt đầu khi lớp thực hành</small>';
document.querySelector('.deck-header').append(timer);
let timerCp='',remaining=0,end=null,ticking=false;const saved={};
function seconds(){return end===null?remaining:Math.ceil((end-Date.now())/1000)}
function paintTimer(){const n=seconds(),a=Math.abs(n);document.querySelector('#remaining').textContent=plan[timerCp]?.minutes?`${n<0?'-':''}${String(Math.floor(a/60)).padStart(2,'0')}:${String(a%60).padStart(2,'0')}`:timerCp==='INTRO'?'Giới thiệu':'Tự học';timer.classList.toggle('overtime',n<0);document.querySelector('#timerStatus').textContent=n<0?'Đã hết thời gian checkpoint':ticking?'Đang đếm ngược':plan[timerCp]?.minutes?'Sẵn sàng / tạm dừng':timerCp==='INTRO'?'Chưa bắt đầu checkpoint':'Hoàn thành trước 23:59';document.querySelector('#startTimer').textContent=ticking?'Tạm dừng':'Bắt đầu';document.querySelector('#startTimer').disabled=!plan[timerCp]?.minutes;}
function checkpoint(cp){if(cp===timerCp)return;if(timerCp)saved[timerCp]={remaining:seconds()};timerCp=cp;remaining=saved[cp]?.remaining??plan[cp].minutes*60;end=null;ticking=false;document.querySelector('#slot').textContent=`${cp} · ${plan[cp].label} · ${plan[cp].time}`;paintTimer()}
document.querySelector('#startTimer').onclick=()=>{if(!plan[timerCp].minutes)return;if(ticking){remaining=seconds();end=null}else end=Date.now()+remaining*1000;ticking=!ticking;paintTimer()};document.querySelector('#resetTimer').onclick=()=>{remaining=plan[timerCp].minutes*60;end=null;ticking=false;paintTimer()};setInterval(paintTimer,250);
const baseShow=show;show=function(n){baseShow(n);checkpoint(slides[current].cp);const s=document.querySelectorAll('.slide')[current];s.querySelector('.slide-inner').animate([{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'translateY(0)'}],{duration:matchMedia('(prefers-reduced-motion: reduce)').matches?0:380,easing:'ease-out'});};
const scene=document.createElement('div');scene.className='lab-scene';scene.setAttribute('aria-hidden','true');scene.innerHTML='<span></span><span></span><span></span>';document.body.prepend(scene);
const pipeline=document.querySelectorAll('.slide')[slides.findIndex(s=>s.title==='Quy trình đánh giá')].querySelector('.slide-inner');pipeline.insertAdjacentHTML('beforeend','<div class="eval-animation" aria-label="Luồng đánh giá động"><span>Eval set</span><span>Agent</span><span>Graders</span><span>Report</span><span>Gate</span></div>');
document.querySelectorAll('[data-cp]').forEach(b=>{b.textContent=b.dataset.cp==='INTRO'?'Tổng quan':b.dataset.cp;b.title=plan[b.dataset.cp].label});
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='p')document.querySelector('#startTimer').click();if(e.key.toLowerCase()==='r')document.querySelector('#resetTimer').click()});
